[project]
name = "sip-regression"
version = "0.1.0"
description = "SIPp scenarios and a Python runner that put a real Asterisk through a regression suite."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "E701", "SIM105", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF059"]
