; Test PBX for sip-regression. Placeholders in braces after a dollar sign are filled in by sipreg/pbx.py.

[transport-udp]
type = transport
protocol = udp
bind = 127.0.0.1:${SIP_PORT}

; Two ordinary phones. Both need a password; there is no "anonymous" endpoint,
; so a caller nobody knows cannot reach the dialplan at all.
[101]
type = endpoint
context = internal
disallow = all
allow = alaw,ulaw
auth = auth101
aors = 101
direct_media = no
rtp_symmetric = yes
force_rport = yes

[auth101]
type = auth
auth_type = userpass
username = 101
password = ${PW_101}

[101]
type = aor
max_contacts = 1
remove_existing = yes

[102]
type = endpoint
context = internal
disallow = all
allow = alaw,ulaw
auth = auth102
aors = 102
direct_media = no
rtp_symmetric = yes
force_rport = yes

[auth102]
type = auth
auth_type = userpass
username = 102
password = ${PW_102}

[102]
type = aor
max_contacts = 1
remove_existing = yes
