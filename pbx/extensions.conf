[general]
static = yes
writeprotect = no

[internal]
; 600  echo: whatever you send comes back (used to prove audio flows)
exten = 600,1,Answer()
 same = n,Echo()
 same = n,Hangup()

; 601  a short call: answer, wait one second, hang up from the PBX side
exten = 601,1,Answer()
 same = n,Wait(1)
 same = n,Hangup()

; 602  busy
exten = 602,1,Busy(5)

; 603  congestion
exten = 603,1,Congestion(5)

; 604  tone: 440 Hz for three seconds, then the PBX hangs up
exten = 604,1,Answer()
 same = n,Milliwatt()

; 101 and 102 ring each other's phone
exten = _10X,1,Dial(PJSIP/${EXTEN},10)
 same = n,Hangup()

; anything else: not found
exten = i,1,Hangup()
